<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zombie Shooter</title>
<style>
:root{--bg:#f1eee6;--text:#1f2622;--muted:#6b756e;--field:#d9d6c8;--line:#cbc7b6;--zom:#6fa05a;--zdark:#3f6b34;--player:#2d6cdf;--bullet:#e0a020;--hp:#d64545;--kit:#2fa866;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--text:#e6ece8;--muted:#8a968f;--field:#1b2220;--line:#252e2b;--zom:#7fbf68;--zdark:#4d8a40;--player:#5b97ff;--bullet:#ffd15c;--hp:#ff6b6b;--kit:#4de08e}}
:root[data-theme="dark"]{--bg:#121615;--text:#e6ece8;--muted:#8a968f;--field:#1b2220;--line:#252e2b;--zom:#7fbf68;--zdark:#4d8a40;--player:#5b97ff;--bullet:#ffd15c;--hp:#ff6b6b;--kit:#4de08e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 10px 24px}
h1{margin:0;font-size:1.5rem}
canvas{width:min(96vw,800px);aspect-ratio:8/5;height:auto;background:var(--field);border-radius:14px;display:block;touch-action:none;cursor:crosshair}
.hint{color:var(--muted);font-size:.85rem;text-align:center;max-width:760px;margin:0}
</style>
</head>
<body>
<h1>🧟 Zombie Shooter</h1>
<canvas id="c" width="800" height="500"></canvas>
<p class="hint">Bewegen: ZQSD of pijltjes. Richten met de muis, schieten met klikken (ingedrukt houden mag). Spatie = pauze. Op een telefoon: sleep om te bewegen, richten en schieten gaat vanzelf.</p>
<script>
(function(){
var W=800,H=500,cv=document.getElementById('c'),ctx=cv.getContext('2d');
var keys={},mouse={x:W/2,y:H/2,down:false},touch=null;
var P,Z,B,K,F,score,wave,toSpawn,spawnT,cool,msgT,best=0,state='idle',last=0;
try{best=parseInt(localStorage.getItem('zs-best'),10)||0}catch(e){}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function newGame(){
  P={x:W/2,y:H/2,hp:100,a:0,r:12};Z=[];B=[];K=[];F=[];score=0;wave=0;cool=0;state='run';nextWave();
}
function nextWave(){wave++;toSpawn=3+wave*2;spawnT=60;msgT=120}
function spawn(){
  var s=Math.floor(Math.random()*4),x,y;
  if(s===0){x=Math.random()*W;y=-20}else if(s===1){x=Math.random()*W;y=H+20}
  else if(s===2){x=-20;y=Math.random()*H}else{x=W+20;y=Math.random()*H}
  var big=wave>=3&&Math.random()<.2;
  Z.push({x:x,y:y,hp:big?5:2,m:big?5:2,r:big?18:12,s:(big?.5:.6+Math.min(.7,wave*.06)),big:big});
}
function burst(x,y,c){for(var i=0;i<6;i++){var a=Math.random()*6.28;F.push({x:x,y:y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,l:18,c:c})}}
function update(dt){
  var dx=0,dy=0;
  if(keys.d||keys.arrowright)dx++;if(keys.q||keys.arrowleft)dx--;
  if(keys.s||keys.arrowdown)dy++;if(keys.z||keys.arrowup)dy--;
  if(touch){var tx=touch.x-touch.ox,ty=touch.y-touch.oy,l=Math.hypot(tx,ty);if(l>8){dx=tx/Math.max(l,50);dy=ty/Math.max(l,50)}}
  var m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  P.x=Math.max(P.r,Math.min(W-P.r,P.x+dx*2.8*dt));
  P.y=Math.max(P.r,Math.min(H-P.r,P.y+dy*2.8*dt));
  var near=null,nd=1e9;
  Z.forEach(function(z){var d=Math.hypot(z.x-P.x,z.y-P.y);if(d<nd){nd=d;near=z}});
  if(touch){if(near)P.a=Math.atan2(near.y-P.y,near.x-P.x)}else P.a=Math.atan2(mouse.y-P.y,mouse.x-P.x);
  cool-=dt;
  if((mouse.down||(touch&&near))&&cool<=0){B.push({x:P.x,y:P.y,vx:Math.cos(P.a)*9,vy:Math.sin(P.a)*9});cool=14}
  B.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt});
  B=B.filter(function(b){return b.x>-10&&b.x<W+10&&b.y>-10&&b.y<H+10});
  B.forEach(function(b){
    for(var i=0;i<Z.length;i++){var z=Z[i];
      if(Math.hypot(z.x-b.x,z.y-b.y)<z.r+3){b.dead=1;z.hp--;burst(b.x,b.y,'--zdark');
        if(z.hp<=0){z.dead=1;score+=z.big?25:10;burst(z.x,z.y,'--hp');if(Math.random()<.12)K.push({x:z.x,y:z.y})}
        break}}
  });
  B=B.filter(function(b){return!b.dead});Z=Z.filter(function(z){return!z.dead});
  Z.forEach(function(z){
    var a=Math.atan2(P.y-z.y,P.x-z.x);z.x+=Math.cos(a)*z.s*dt;z.y+=Math.sin(a)*z.s*dt;
    if(Math.hypot(P.x-z.x,P.y-z.y)<P.r+z.r-2)P.hp-=0.18*dt;
  });
  K=K.filter(function(k){if(Math.hypot(P.x-k.x,P.y-k.y)<P.r+10){P.hp=Math.min(100,P.hp+25);return false}return true});
  F.forEach(function(f){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt});F=F.filter(function(f){return f.l>0});
  spawnT-=dt;
  if(toSpawn>0&&spawnT<=0){spawn();toSpawn--;spawnT=Math.max(35,95-wave*4)}
  if(toSpawn===0&&Z.length===0)nextWave();
  if(msgT>0)msgT-=dt;
  if(P.hp<=0){state='over';mouse.down=false;if(score>best){best=score;try{localStorage.setItem('zs-best',best)}catch(e){}}}
}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function text(t,x,y,size,c,al){ctx.font='700 '+size+'px system-ui,sans-serif';ctx.fillStyle=c;ctx.textAlign=al||'center';ctx.fillText(t,x,y)}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=css('--line');ctx.lineWidth=1;ctx.beginPath();
  for(var i=0;i<=W;i+=50){ctx.moveTo(i,0);ctx.lineTo(i,H)}
  for(var j=0;j<=H;j+=50){ctx.moveTo(0,j);ctx.lineTo(W,j)}
  ctx.stroke();
  if(!P){startIdle();return}
  K.forEach(function(k){circle(k.x,k.y,10,css('--kit'));ctx.fillStyle='#fff';ctx.fillRect(k.x-6,k.y-2,12,4);ctx.fillRect(k.x-2,k.y-6,4,12)});
  Z.forEach(function(z){
    circle(z.x,z.y,z.r,css(z.big?'--zdark':'--zom'));
    var a=Math.atan2(P.y-z.y,P.x-z.x);
    circle(z.x+Math.cos(a+.5)*z.r*.5,z.y+Math.sin(a+.5)*z.r*.5,2.5,'#111');
    circle(z.x+Math.cos(a-.5)*z.r*.5,z.y+Math.sin(a-.5)*z.r*.5,2.5,'#111');
    if(z.big){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(z.x-14,z.y-z.r-8,28,4);ctx.fillStyle=css('--hp');ctx.fillRect(z.x-14,z.y-z.r-8,28*z.hp/z.m,4)}
  });
  F.forEach(function(f){ctx.globalAlpha=f.l/18;circle(f.x,f.y,2.5,css(f.c));ctx.globalAlpha=1});
  B.forEach(function(b){circle(b.x,b.y,3.5,css('--bullet'))});
  ctx.strokeStyle=css('--text');ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x+Math.cos(P.a)*20,P.y+Math.sin(P.a)*20);ctx.stroke();
  circle(P.x,P.y,P.r,css('--player'));
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(14,14,150,12);
  ctx.fillStyle=css('--hp');ctx.fillRect(14,14,150*Math.max(0,P.hp)/100,12);
  text('Score '+score,W-14,26,18,css('--text'),'right');
  text('Record '+best,W-14,48,13,css('--muted'),'right');
  text('Golf '+wave,14,48,13,css('--muted'),'left');
  if(msgT>0&&state==='run')text('Golf '+wave,W/2,90,34,css('--text'));
  if(state!=='run'){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    if(state==='pause')text('Pauze',W/2,H/2,38,'#fff');
    else if(state==='over'){text('Game over',W/2,H/2-10,40,'#fff');text('Score '+score+' · klik om opnieuw te spelen',W/2,H/2+26,18,'#fff')}
  }
}
function loop(t){
  var dt=Math.min(2,(t-last)/16.67||1);last=t;
  if(state==='run')update(dt);
  draw();requestAnimationFrame(loop);
}
function startIdle(){
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
  text('Overleef de zombies!',W/2,H/2-10,36,'#fff');text('Klik of tik om te starten',W/2,H/2+26,18,'#fff');
}
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',function(e){
  var p=pos(e);
  if(state==='idle'||state==='over'){newGame();return}
  if(state==='pause'){state='run';return}
  if(e.pointerType==='touch'){touch={ox:p.x,oy:p.y,x:p.x,y:p.y,id:e.pointerId}}
  else{mouse.x=p.x;mouse.y=p.y;mouse.down=true}
});
cv.addEventListener('pointermove',function(e){
  var p=pos(e);
  if(e.pointerType==='touch'){if(touch&&touch.id===e.pointerId){touch.x=p.x;touch.y=p.y}}
  else{mouse.x=p.x;mouse.y=p.y}
});
function up(e){if(e.pointerType==='touch'){if(touch&&touch.id===e.pointerId)touch=null}else mouse.down=false}
window.addEventListener('pointerup',up);
window.addEventListener('pointercancel',up);
document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(' zqsd'.indexOf(k)>-1||k.indexOf('arrow')===0)e.preventDefault();
  if(k===' '){if(state==='run')state='pause';else if(state==='pause')state='run';else newGame();return}
  keys[k]=true;
});
document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',function(){keys={};mouse.down=false;if(state==='run')state='pause'});
requestAnimationFrame(function(t){last=t;startIdle();requestAnimationFrame(function(t2){last=t2;if(state==='idle')startIdle();loop(t2)})});
})();
</script>
</body>
</html>
